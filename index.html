<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>an apparition</title>
  <link rel="icon" href="Favicon.png">
  <link rel="stylesheet" href="style.css">
  <script>
    const BACKGROUNDS = [
      "#7D8C7C", /* sage */
      "#9E7B6B", /* terracotta */
      "#8B8680", /* ash */
      "#8C7D82", /* dusty mauve */
      "#7A8A8C", /* warm slate */
      "#A08C72", /* warm sand */
      "#6E7E72", /* moss */
      "#D0C337", /* olive */
      "#907878", /* muted rose */
    ];
    document.addEventListener("DOMContentLoaded", () => {
      document.body.style.background =
        BACKGROUNDS[Math.floor(Math.random() * BACKGROUNDS.length)];
    });
  </script>
</head>

<body>
  <div class="page-sheet">

    <img src="Vase.png" alt="A vase with a short, rounded rim." class="corner-image">
    <!-- Source: https://www.metmuseum.org/art/collection/search/547137 -->

    <h1>Fragile Fragments</h1>

    <div class="writing-surface">
      <div class="editor-wrapper">

        <div class="poem-start">
          <span style="margin-left: 2em;">
            <span class="poem-word" data-drift="down">falling</span>
          </span>
          <br>
          <span style="margin-left: 7em;">
            <span class="poem-word" data-drift="apart">in</span>
            <span class="poem-word" data-drift="apart-right">two:</span>
          </span>
        </div>

        <div id="editor" class="editable" contenteditable="true">I am <span class="cursor-blink">|</span></div>

        <div class="poem-end">
          <span style="margin-left: 7em;">but, so be it.</span>
        </div>

        <div class="colophon">
        <a href="https://celune.cargo.site/" target="_blank" rel="noopener">
        <img src="Ellipsis.gif" alt="Two overlapping grey circles grow and shrink" class="colophon-icon"></a>        
        <span>Commissioned by The Photographers' Gallery and Goethe-Institut London</span>
        </div>

      </div>
    </div>

    <div class="instruction">Press Enter to accept assumptions</div>
    <div class="note no-wrap">Prone to bias</div>

  <!-- Menu -->
  
  <div class="menu">
    <a href="#" class="menu-link">
      <span class="hamburger-icon">
        <span class="hamburger-bar hamburger-bar-1"></span>
        <span class="hamburger-bar hamburger-bar-2"></span>
        <span class="hamburger-bar hamburger-bar-3"></span>
      </span>
    </a>
  </div>

  <div class="menu-overlay">
    <nav class="overlay-menu">
      <ul class="one">
        <li><a class="nav-links" href="#">About</a></li>
        <li><a class="nav-links" href="#">Guide</a></li>
        <li><a class="nav-links" href="#">Feedback</a></li>
      </ul>
    </nav>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
