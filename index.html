<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>an /a)ppar/i)tion</title>
  <link rel="icon" href="Favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lancelot&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Random background on load -->
  <script>
    const BACKGROUNDS = [
      "#7D8C7C", /* sage */
      "#9E7B6B", /* terracotta */
      "#8B8680", /* ash */
      "#8C7D82", /* dusty mauve */
      "#7A8A8C", /* warm slate */
      "#A08C72", /* warm sand */
      "#6E7E72", /* moss */
      "#D0C337", /* olive */
      "#907878", /* muted rose */
    ];
    document.addEventListener("DOMContentLoaded", () => {
      const colour = BACKGROUNDS[Math.floor(Math.random() * BACKGROUNDS.length)];
      document.body.style.background = colour;
    });
  </script>
</head>

<body class="mode-masc">
  <div class="page-sheet">

    <img src="Vase.png" alt="A vase with a short, rounded rim." class="corner-image">
    <!-- Source: https://www.metmuseum.org/art/collection/search/547137 -->

    <!-- Headings -->
    <h1>A Poem</h1>
    <h2>Translated by an Apparition</h2>

    <!-- Writing surface -->
    <div class="writing-surface">
      <div class="editor-wrapper">

        <div class="poem-start">
  <span style="margin-left: 2em;">
    <span class="poem-word" data-drift="down">falling</span>
  </span>
  <br>
  <span style="margin-left: 7em;">
    <span class="poem-word" data-drift="apart">in</span> <span class="poem-word" data-drift="apart-right">two:</span>
  </span>
</div>

        <div id="editor" class="editable" contenteditable="true">I am <span class="cursor-blink">|</span></div>

        <div class="poem-end">
          <span style="margin-left: 7em;">but, so be it.</span>
        </div>

        <div class="colophon">
          <!-- <div>"an apparition," orbit, no. 4 (2026)</div> -->
          <!-- <br> -->
          <div>Commissioned by The Photographers' Gallery and Goethe-Institut London</div>
        </div>

      </div>
    </div>

    <!-- Notes -->
    <div class="instruction">
      Press Enter to accept assumptions
    </div>

    <div class="note no-wrap">
      Prone to bias
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
