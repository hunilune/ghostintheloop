<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>an /a)ppar/i)tion</title>
  <link rel="icon" href="Favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lancelot&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Random background on load -->
  <script>
    const BACKGROUNDS = [
      "#7D8C7C", /* sage */
      "#9E7B6B", /* terracotta */
      "#8B8680", /* ash */
      "#8C7D82", /* dusty mauve */
      "#7A8A8C", /* warm slate */
      "#A08C72", /* warm sand */
      "#6E7E72", /* moss */
      "D0C337", /* olive */
      "#907878", /* muted rose */
    ];
    document.addEventListener("DOMContentLoaded", () => {
      const colour = BACKGROUNDS[Math.floor(Math.random() * BACKGROUNDS.length)];
      document.body.style.background = colour;
    });
  </script>
</head>

<body class="mode-masc">

  <!-- Hidden SVG filter for scan/ink effect on poem text -->
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;">
    <defs>
      <filter id="scan-ink" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
        <!-- Slight roughness to simulate ink on paper texture -->
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.04 0.065"
          numOctaves="4"
          seed="3"
          result="noise" />
        <!-- Displace letterforms very slightly — scale is intentionally low -->
        <feDisplacementMap
          in="SourceGraphic"
          in2="noise"
          scale="1.6"
          xChannelSelector="R"
          yChannelSelector="G"
          result="displaced" />
        <!-- Micro-blur to soften displaced edges, like ink bleed -->
        <feGaussianBlur
          in="displaced"
          stdDeviation="0.15"
          result="softened" />
        <!-- Restore contrast lost by displacement -->
        <feComponentTransfer in="softened">
          <feFuncA type="linear" slope="1.08" />
        </feComponentTransfer>
      </filter>
    </defs>
  </svg>

  <div class="page-sheet">

    <img src="Vase.png" alt="A brown vase with a short, rounded rim." class="corner-image">
    <!-- Source: https://www.metmuseum.org/art/collection/search/547137 -->

    <!-- Headings -->
    <h1>a poem <span style="color: var(--paper);">|</span> <span style="font-family: Gaisyr, serif;">2026</span></h1>
    <h2>translated by an apparition</h2>

    <!-- Writing surface -->
    <div class="writing-surface">
      <div class="editor-wrapper">

        <div class="poem-start">
          <span style="margin-left: 2em;">falling</span>
          <br>
          <span style="margin-left: 7em;">in two:</span>
        </div>

        <div id="editor" class="editable" contenteditable="true">I am <span class="cursor-blink">|</span></div>

        <div class="poem-end">
          <span style="margin-left: 7em;">but, so be it.</span>
        </div>

        <div class="colophon">
          <div>"an apparition," orbit, no. 4 (2026)</div>
          <br>
          <div>Commissioned by The Photographers' Gallery and Goethe-Institut London</div>
        </div>

      </div>
    </div>

    <!-- Notes -->
    <div class="instruction">
      Press Enter to accept assumptions
    </div>

    <div class="note no-wrap">
      Prone to bias
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
